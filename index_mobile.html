<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Solo Leveling - Life Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            background: #0a0a0f;
            color: #e8e0f0;
            overflow-x: hidden;
        }
        
        #root {
            width: 100%;
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            body { font-size: 14px; }
        }

        @media (max-width: 480px) {
            body { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <script>
        const { useState, useEffect, useCallback } = React;
        const e = React.createElement;

        const USERS_KEY = "sl_users";
        const SESSION_KEY = "sl_session";
        const GAME_STATE_KEY = "sl_gamestate_";

        const RANKS = [
            { name: "E-Rank Hunter", min: 0, max: 999, color: "#9E9E9E" },
            { name: "D-Rank Hunter", min: 1000, max: 2999, color: "#4CAF50" },
            { name: "C-Rank Hunter", min: 3000, max: 5999, color: "#2196F3" },
            { name: "B-Rank Hunter", min: 6000, max: 9999, color: "#9C27B0" },
            { name: "A-Rank Hunter", min: 10000, max: 14999, color: "#FF9800" },
            { name: "S-Rank Hunter", min: 15000, max: 19999, color: "#FFD700" },
            { name: "National Level Hunter", min: 20000, max: 29999, color: "#FF4444" },
            { name: "Shadow Monarch", min: 30000, max: Infinity, color: "#B388FF" },
        ];

        const QUESTS_DEF = [
            { id: 1, key: "screentime", name: "Screentime", icon: "📵", xp: 120, desc: "Max 2hr screen" },
            { id: 2, key: "study", name: "Study", icon: "📚", xp: 150, desc: "2-3 hours" },
            { id: 3, key: "noporn", name: "Purity", icon: "🧠", xp: 200, desc: "No exceptions" },
            { id: 4, key: "outside", name: "Outside", icon: "🌆", xp: 100, desc: "1-2 hours" },
            { id: 5, key: "workout", name: "Workout", icon: "⚔️", xp: 180, desc: "45-60 min" },
            { id: 6, key: "diet", name: "Diet", icon: "🥗", xp: 130, desc: "80%+ targets" },
            { id: 7, key: "partner", name: "Partner", icon: "💜", xp: 110, desc: "Quality time" },
            { id: 8, key: "sleep", name: "Sleep", icon: "🌙", xp: 140, desc: "7-8 hours" },
            { id: 9, key: "water", name: "Water", icon: "💧", xp: 90, desc: "3-4L" },
            { id: 10, key: "meditation", name: "Meditate", icon: "🧘", xp: 100, desc: "10-15 min" },
            { id: 11, key: "shower", name: "Cold Shower", icon: "🥶", xp: 80, desc: "30s-2m" },
            { id: 12, key: "reading", name: "Reading", icon: "📖", xp: 110, desc: "20-30 min" },
            { id: 13, key: "morning", name: "Morning", icon: "🌅", xp: 100, desc: "Routine" },
            { id: 14, key: "steps", name: "Steps", icon: "👣", xp: 120, desc: "10k+" },
            { id: 15, key: "socialmedia", name: "Social", icon: "🚫", xp: 90, desc: "Max 15 min" },
            { id: 16, key: "journal", name: "Journal", icon: "✍️", xp: 100, desc: "10 min" },
            { id: 17, key: "help", name: "Help", icon: "🤝", xp: 80, desc: "Kindness" },
            { id: 18, key: "family", name: "Family", icon: "🏠", xp: 70, desc: "Weekly" },
            { id: 19, key: "gratitude", name: "Gratitude", icon: "🙏", xp: 70, desc: "5 min" },
            { id: 20, key: "nojunk", name: "Clean Food", icon: "🍎", xp: 130, desc: "Whole foods" },
        ];

        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                hash = (hash << 5) - hash + password.charCodeAt(i);
            }
            return hash.toString(36);
        }

        function getUsers() {
            try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); } catch { return {}; }
        }
        function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
        function getSession() {
            try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { return null; }
        }
        function saveSession(session) { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }
        function getGameState(username) {
            try { return JSON.parse(localStorage.getItem(GAME_STATE_KEY + username) || "null"); } catch { return null; }
        }
        function saveGameState(username, state) { localStorage.setItem(GAME_STATE_KEY + username, JSON.stringify(state)); }

        function getRank(xp) { return RANKS.slice().reverse().find(r => xp >= r.min) || RANKS[0]; }
        function getLevelFromXP(xp) { return Math.floor(1 + Math.sqrt(xp / 100)); }
        function getXPForNextLevel(level) { return Math.pow(level, 2) * 100; }
        function getNextResetTime() {
            const now = new Date();
            const next = new Date(now);
            next.setHours(5, 0, 0, 0);
            if (now.getHours() >= 5) next.setDate(next.getDate() + 1);
            return next;
        }
        function formatCountdown(ms) {
            if (ms <= 0) return "00:00:00";
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }
        function createDefaultGameState() {
            return {
                xp: 0, health: 100, streak: 0, lastResetDate: new Date().toDateString(),
                completedQuests: {}, missedQuests: {}, tierCounters: {}, penalties: [],
                xpHistory: [], completionHistory: [], questInputs: {}, totalDaysTracked: 0,
                difficultyMultiplier: 1.0,
            };
        }
        function isSunday() { return new Date().getDay() === 0; }

        const S = {
            app: { minHeight: "100vh", background: "#0a0a0f", color: "#e8e0f0", fontFamily: "'Rajdhani', 'Orbitron', sans-serif", position: "relative" },
            container: { position: "relative", zIndex: 1, maxWidth: 1100, margin: "0 auto", padding: "0 12px" },
            
            authWrap: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" },
            authCard: { background: "rgba(15,10,30,0.95)", border: "1px solid rgba(255,215,0,0.3)", borderRadius: 12, padding: "30px 20px", maxWidth: 350, width: "100%", boxShadow: "0 0 40px rgba(140,0,255,0.1)" },
            authTitle: { fontSize: 11, letterSpacing: 4, color: "#FFD700", textTransform: "uppercase", marginBottom: 6, fontFamily: "'Orbitron'" },
            authHero: { fontSize: 20, fontWeight: 900, color: "#fff", letterSpacing: 1 },
            input: { width: "100%", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,215,0,0.2)", borderRadius: 6, padding: "10px 12px", color: "#e8e0f0", fontSize: 14, outline: "none", boxSizing: "border-box", fontFamily: "'Rajdhani'" },
            label: { fontSize: 10, letterSpacing: 2, color: "#FFD700", textTransform: "uppercase", display: "block", marginBottom: 4 },
            btnGold: { width: "100%", padding: "12px", background: "linear-gradient(135deg, #FFD700, #FF8C00)", border: "none", borderRadius: 6, color: "#0a0a0f", fontWeight: 900, fontSize: 12, letterSpacing: 2, textTransform: "uppercase", cursor: "pointer", fontFamily: "'Rajdhani'" },
            error: { color: "#FF4444", fontSize: 11, textAlign: "center", padding: "6px 0" },

            nav: { background: "rgba(10,8,20,0.95)", borderBottom: "1px solid rgba(255,215,0,0.1)", padding: "8px 0", position: "sticky", top: 0, zIndex: 100 },
            navInner: { maxWidth: 1100, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", height: 50, padding: "0 12px" },
            navBrand: { fontSize: 13, fontWeight: 900, color: "#FFD700", letterSpacing: 2, fontFamily: "'Orbitron'" },
            navTabs: { display: "flex", gap: 2 },
            navTab: (active) => ({ padding: "4px 10px", borderRadius: 4, fontSize: 11, cursor: "pointer", background: active ? "rgba(255,215,0,0.15)" : "transparent", color: active ? "#FFD700" : "#666", border: "none", transition: "all 0.2s" }),

            statCard: { background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 10, padding: "14px 16px" },
            statLabel: { fontSize: 9, letterSpacing: 2, color: "#555", textTransform: "uppercase", marginBottom: 4 },
            statVal: { fontSize: 22, fontWeight: 900, color: "#FFD700" },
            statSub: { fontSize: 10, color: "#555", marginTop: 2 },
            grid4: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 },

            barWrap: { height: 6, background: "rgba(255,255,255,0.08)", borderRadius: 3, overflow: "hidden" },
            bar: (pct, color) => ({ height: "100%", width: `${Math.max(0, Math.min(100, pct))}%`, background: color, borderRadius: 3, transition: "width 0.6s" }),

            questCard: (done) => ({ background: done ? "rgba(76,175,80,0.08)" : "rgba(255,255,255,0.02)", border: `1px solid ${done ? "rgba(76,175,80,0.2)" : "rgba(255,255,255,0.05)"}`, borderRadius: 8, padding: "12px 14px", marginBottom: 8 }),
            questIcon: { fontSize: 18, marginRight: 8 },
            questName: { fontSize: 13, fontWeight: 700, color: "#e8e0f0" },
            questDesc: { fontSize: 11, color: "#555", marginTop: 2 },
            questXP: (done) => ({ fontSize: 10, color: done ? "#4CAF50" : "#FFD700", fontWeight: 700 }),
            checkbox: { width: 18, height: 18, borderRadius: 3, border: "2px solid rgba(255,215,0,0.3)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" },

            sectionTitle: { fontSize: 10, letterSpacing: 3, color: "#FFD700", textTransform: "uppercase", marginBottom: 12, fontFamily: "'Orbitron'" },
            divider: { height: 1, background: "rgba(255,255,255,0.05)", margin: "16px 0" },
        };

        function SoloLevelingTracker() {
            const [session, setSession] = useState(() => getSession());
            const [tab, setTab] = useState("dashboard");
            const [gs, setGS] = useState(null);
            const [countdown, setCountdown] = useState("");
            const [penaltyModal, setPenaltyModal] = useState(null);

            useEffect(() => {
                if (!session) return;
                let state = getGameState(session.username);
                if (!state) state = createDefaultGameState();
                const today = new Date().toDateString();
                if (state.lastResetDate !== today) {
                    const completed = Object.keys(state.completedQuests).length;
                    const rate = completed / 20;
                    state.completionHistory = [...(state.completionHistory || []).slice(-29), rate];
                    if (rate >= 0.8) state.streak = (state.streak || 0) + 1;
                    else state.streak = 0;
                    state.completedQuests = {};
                    state.questInputs = {};
                    state.lastResetDate = today;
                    state.totalDaysTracked = (state.totalDaysTracked || 0) + 1;
                    state.penalties = state.penalties?.slice(-10) || [];
                }
                setGS(state);
                saveGameState(session.username, state);
            }, [session]);

            useEffect(() => {
                const tick = () => setCountdown(formatCountdown(getNextResetTime() - Date.now()));
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, []);

            const updateGS = useCallback((updater) => {
                setGS(prev => {
                    const next = updater(prev);
                    saveGameState(session.username, next);
                    return next;
                });
            }, [session]);

            function completeQuest(quest) {
                if (!gs) return;
                if (gs.completedQuests[quest.key]) {
                    updateGS(prev => ({
                        ...prev,
                        completedQuests: Object.fromEntries(Object.entries(prev.completedQuests).filter(([k]) => k !== quest.key)),
                        xp: Math.max(0, prev.xp - Math.round(quest.xp * prev.difficultyMultiplier)),
                    }));
                    return;
                }
                const xpGain = Math.round(quest.xp * (gs.difficultyMultiplier || 1));
                updateGS(prev => ({
                    ...prev,
                    completedQuests: { ...prev.completedQuests, [quest.key]: Date.now() },
                    xp: prev.xp + xpGain,
                    health: Math.min(100, prev.health + 2),
                    tierCounters: { ...prev.tierCounters, [quest.key]: 0 },
                }));
            }

            function missQuest(quest) {
                if (!gs) return;
                const currentTier = (gs.tierCounters?.[quest.key] || 0);
                const newTier = Math.min(3, currentTier + 1);
                const hpLoss = newTier === 1 ? 12 : newTier === 2 ? 22 : 50;
                const xpLoss = newTier === 1 ? 75 : newTier === 2 ? 150 : 300;

                updateGS(prev => ({
                    ...prev,
                    health: Math.max(0, prev.health - hpLoss),
                    xp: Math.max(0, prev.xp - xpLoss),
                    tierCounters: { ...prev.tierCounters, [quest.key]: newTier },
                    missedQuests: { ...prev.missedQuests, [quest.key]: (prev.missedQuests?.[quest.key] || 0) + 1 },
                    penalties: [...(prev.penalties || []).slice(-9), { quest: quest.name, tier: newTier, hpLoss, xpLoss, time: Date.now() }],
                }));

                setPenaltyModal({ quest: quest.name, tier: newTier, hpLoss, xpLoss });
            }

            function logout() { saveSession(null); setSession(null); setGS(null); setTab("dashboard"); }

            if (!session) return e(AuthScreen, { onAuth: (s) => setSession(s) });
            if (!gs) return e("div", { style: S.authWrap }, e("div", null, "Loading..."));

            const level = getLevelFromXP(gs.xp);
            const rank = getRank(gs.xp);
            const xpProgress = ((gs.xp - (Math.pow(level - 1, 2) * 100)) / (Math.pow(level, 2) * 100 - Math.pow(level - 1, 2) * 100)) * 100;
            const completedCount = Object.keys(gs.completedQuests).length;

            return e("div", { style: S.app },
                penaltyModal && e("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }, onClick: () => setPenaltyModal(null) },
                    e("div", { style: { background: "rgba(15,10,30,0.98)", border: "1px solid rgba(255,68,68,0.3)", borderRadius: 10, padding: 20, maxWidth: 300, width: "100%" }, onClick: (e) => e.stopPropagation() },
                        e("div", { style: { fontSize: 16, fontWeight: 900, color: "#FF4444", marginBottom: 10 } }, "TIER " + penaltyModal.tier),
                        e("div", { style: { fontSize: 13, color: "#ccc", marginBottom: 10 } }, penaltyModal.quest),
                        e("div", { style: { fontSize: 12, color: "#aaa", marginBottom: 15 } }, `-${penaltyModal.hpLoss}% HP | -${penaltyModal.xpLoss} XP`),
                        e("button", { style: { ...S.btnGold, fontSize: 11 }, onClick: () => setPenaltyModal(null) }, "OK")
                    )
                ),

                e("nav", { style: S.nav },
                    e("div", { style: S.navInner },
                        e("div", { style: S.navBrand }, "⚔ SL"),
                        e("div", { style: S.navTabs },
                            ["dashboard", "quests", "analytics", "penalties", "profile"].map(t =>
                                e("button", { key: t, style: S.navTab(tab === t), onClick: () => setTab(t) }, 
                                    t === "dashboard" ? "🏠" : t === "quests" ? "⚔️" : t === "analytics" ? "📊" : t === "penalties" ? "⚠️" : "👤")
                            )
                        ),
                        e("button", { style: { background: "transparent", border: "1px solid rgba(255,215,0,0.2)", color: "#FFD700", padding: "4px 8px", borderRadius: 4, cursor: "pointer", fontSize: 10, letterSpacing: 1 }, onClick: logout }, "Exit")
                    )
                ),

                e("div", { style: S.container },
                    e("div", { style: { padding: "16px 0 40px" } },
                        tab === "dashboard" && e("div", null,
                            e("div", { style: { marginBottom: 16 } },
                                e("div", { style: { fontSize: 20, fontWeight: 900, color: "#fff", marginBottom: 4 } }, session.name.toUpperCase()),
                                e("div", { style: { fontSize: 12, color: rank.color } }, rank.name)
                            ),

                            e("div", { style: S.grid4 },
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Level"), e("div", { style: S.statVal }, level)),
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Streak"), e("div", { style: S.statVal }, gs.streak + "🔥")),
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "XP"), e("div", { style: S.statVal }, gs.xp.toLocaleString())),
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Reset"), e("div", { style: { ...S.statVal, fontSize: 14 } }, countdown))
                            ),

                            e("div", { style: { ...S.statCard, marginTop: 12, marginBottom: 12 } },
                                e("div", { style: S.statLabel }, "XP Progress"),
                                e("div", { style: S.barWrap }, e("div", { style: S.bar(xpProgress, "linear-gradient(90deg, #FFD700, #FF8C00)") }))
                            ),

                            e("div", { style: { ...S.statCard, marginBottom: 16 } },
                                e("div", { style: S.statLabel }, "Health"),
                                e("div", { style: S.barWrap }, e("div", { style: S.bar(gs.health, gs.health > 60 ? "#4CAF50" : gs.health > 30 ? "#FF9800" : "#FF4444") })),
                                e("div", { style: { fontSize: 10, color: "#555", marginTop: 4 } }, Math.round(gs.health) + "%")
                            ),

                            e("div", { style: S.sectionTitle }, completedCount + " / 20 Quests"),
                            e("div", { style: { display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 6 } },
                                QUESTS_DEF.map(q => {
                                    const done = !!gs.completedQuests[q.key];
                                    return e("div", { key: q.id, style: { background: done ? "rgba(76,175,80,0.15)" : "rgba(255,255,255,0.02)", border: `1px solid ${done ? "rgba(76,175,80,0.2)" : "rgba(255,255,255,0.05)"}`, borderRadius: 6, padding: 6, textAlign: "center" } },
                                        e("div", { style: { fontSize: 16 } }, q.icon),
                                        e("div", { style: { fontSize: 8, color: done ? "#4CAF50" : "#555", marginTop: 2 } }, done ? "✓" : "–")
                                    );
                                })
                            )
                        ),

                        tab === "quests" && e("div", null,
                            e("div", { style: S.sectionTitle }, "Daily Quests"),
                            QUESTS_DEF.map((quest) => {
                                const done = !!gs.completedQuests[quest.key];
                                const isSundayRest = quest.key === "workout" && isSunday();
                                const xpAdjusted = Math.round(quest.xp * (gs.difficultyMultiplier || 1));

                                return e("div", { key: quest.id, style: S.questCard(done) },
                                    e("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
                                        e("div", { style: { ...S.checkbox, background: done ? "rgba(76,175,80,0.3)" : "transparent", borderColor: done ? "#4CAF50" : "rgba(255,215,0,0.3)" }, onClick: () => !isSundayRest && completeQuest(quest) }, done && e("span", { style: { color: "#4CAF50", fontSize: 11, fontWeight: 900 } }, "✓")),
                                        e("div", { style: { flex: 1 } },
                                            e("div", { style: { display: "flex", alignItems: "center", gap: 6 } },
                                                e("span", { style: S.questIcon }, quest.icon),
                                                e("span", { style: S.questName }, quest.name)
                                            ),
                                            e("div", { style: S.questDesc }, quest.desc)
                                        ),
                                        e("div", { style: { textAlign: "right" } },
                                            e("div", { style: S.questXP(done) }, "+" + xpAdjusted),
                                            !done && !isSundayRest && e("button", { style: { marginTop: 4, background: "rgba(255,68,68,0.1)", border: "1px solid rgba(255,68,68,0.25)", color: "#FF4444", borderRadius: 3, padding: "2px 6px", fontSize: 9, cursor: "pointer" }, onClick: () => missQuest(quest) }, "FAIL")
                                        )
                                    )
                                );
                            })
                        ),

                        tab === "analytics" && e("div", null,
                            e("div", { style: S.sectionTitle }, "Stats"),
                            e("div", { style: S.grid4 },
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Days"), e("div", { style: S.statVal }, gs.totalDaysTracked)),
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Streak"), e("div", { style: S.statVal }, gs.streak)),
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Avg"), e("div", { style: S.statVal }, gs.completionHistory?.length ? Math.round((gs.completionHistory.reduce((a, b) => a + b, 0) / gs.completionHistory.length) * 100) : 0) + "%"),
                                e("div", { style: S.statCard }, e("div", { style: S.statLabel }, "Total XP"), e("div", { style: S.statVal }, gs.xp.toLocaleString()))
                            )
                        ),

                        tab === "penalties" && e("div", null,
                            e("div", { style: S.sectionTitle }, "Penalties"),
                            !gs.penalties || gs.penalties.length === 0 ? e("div", { style: { ...S.statCard, textAlign: "center", padding: 20 } }, e("div", { style: { fontSize: 12, color: "#555" } }, "No penalties. Good job!")) :
                            [...(gs.penalties || [])].reverse().slice(0, 5).map((p, i) =>
                                e("div", { key: i, style: { background: "rgba(255,68,68,0.07)", border: "1px solid rgba(255,68,68,0.2)", borderRadius: 8, padding: 12, marginBottom: 8 } },
                                    e("div", { style: { fontSize: 11, fontWeight: 700, color: "#FF4444", marginBottom: 4 } }, "TIER " + p.tier + " — " + p.quest),
                                    e("div", { style: { fontSize: 10, color: "#aaa" } }, `-${p.hpLoss}% HP | -${p.xpLoss} XP`)
                                )
                            )
                        ),

                        tab === "profile" && e("div", null,
                            e("div", { style: S.sectionTitle }, "Profile"),
                            e("div", { style: { ...S.statCard, marginBottom: 12 } },
                                e("div", { style: { fontSize: 18, fontWeight: 900, color: "#fff", marginBottom: 4 } }, session.name),
                                e("div", { style: { fontSize: 12, color: rank.color, marginBottom: 8 } }, rank.name),
                                e("div", { style: { fontSize: 11, color: "#555" } }, "Level " + level + " • " + gs.xp.toLocaleString() + " XP")
                            ),
                            e("div", { style: S.sectionTitle }, "Rank Ladder"),
                            e("div", null,
                                RANKS.map(r => {
                                    const current = gs.xp >= r.min && gs.xp <= r.max;
                                    return e("div", { key: r.name, style: { ...S.statCard, marginBottom: 6, padding: "10px 12px", border: current ? `1px solid ${r.color}` : "1px solid rgba(255,255,255,0.05)" } },
                                        e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
                                            e("div", null,
                                                e("div", { style: { fontSize: 11, fontWeight: current ? 700 : 400, color: current ? "#fff" : "#888" } }, r.name),
                                                current && e("div", { style: { fontSize: 9, color: r.color } }, "CURRENT")
                                            ),
                                            e("div", { style: { fontSize: 10, color: "#555" } }, r.min.toLocaleString())
                                        )
                                    );
                                })
                            ),
                            e("div", { style: S.divider }),
                            e("button", { style: { ...S.btnGold, fontSize: 11, background: "rgba(255,68,68,0.2)", color: "#FF4444" }, onClick: () => { if (confirm("RESET?")) { saveGameState(session.username, createDefaultGameState()); setGS(createDefaultGameState()); } } }, "⚠ RESET DATA")
                        )
                    )
                )
            );
        }

        function AuthScreen({ onAuth }) {
            const [mode, setMode] = useState("login");
            const [form, setForm] = useState({ username: "", password: "", confirm: "" });
            const [msg, setMsg] = useState("");

            function doLogin() {
                const users = getUsers();
                const u = users[form.username.toLowerCase()];
                if (!u) return setMsg("Not found.");
                if (u.password !== hashPassword(form.password)) return setMsg("Wrong password.");
                saveSession({ username: form.username.toLowerCase(), name: u.name });
                onAuth({ username: form.username.toLowerCase(), name: u.name });
            }

            function doRegister() {
                if (!form.username || !form.password) return setMsg("All fields required.");
                if (form.password !== form.confirm) return setMsg("Passwords don't match.");
                if (form.password.length < 6) return setMsg("Min 6 characters.");
                const users = getUsers();
                if (users[form.username.toLowerCase()]) return setMsg("Username taken.");
                users[form.username.toLowerCase()] = { name: form.username, password: hashPassword(form.password) };
                saveUsers(users);
                setMsg("Success! Log in.");
                setMode("login");
            }

            return e("div", { style: S.authWrap },
                e("div", { style: S.authCard },
                    e("div", { style: { textAlign: "center", marginBottom: 24 } },
                        e("div", { style: S.authTitle }, "⚔ THE SYSTEM ⚔"),
                        e("div", { style: { ...S.authHero, marginTop: 6 } }, "SOLO LEVELING"),
                        e("div", { style: { fontSize: 14, color: "#B388FF", marginTop: 4 } }, "LIFE TRACKER")
                    ),

                    e("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
                        e("div", null,
                            e("label", { style: S.label }, "Username"),
                            e("input", { style: S.input, placeholder: "Enter", value: form.username, onChange: (e) => setForm(f => ({ ...f, username: e.target.value })), onKeyDown: (e) => e.key === "Enter" && (mode === "login" ? doLogin() : doRegister()) })
                        ),
                        e("div", null,
                            e("label", { style: S.label }, "Password"),
                            e("input", { style: S.input, type: "password", placeholder: "Enter", value: form.password, onChange: (e) => setForm(f => ({ ...f, password: e.target.value })), onKeyDown: (e) => e.key === "Enter" && (mode === "login" ? doLogin() : doRegister()) })
                        ),
                        mode === "register" && e("div", null,
                            e("label", { style: S.label }, "Confirm"),
                            e("input", { style: S.input, type: "password", placeholder: "Confirm", value: form.confirm, onChange: (e) => setForm(f => ({ ...f, confirm: e.target.value })), onKeyDown: (e) => e.key === "Enter" && doRegister() })
                        ),
                        msg && e("div", { style: msg.includes("Success") ? { color: "#4CAF50", fontSize: 11, textAlign: "center" } : S.error }, msg),
                        e("button", { style: S.btnGold, onClick: () => mode === "login" ? doLogin() : doRegister() }, mode === "login" ? "⚔ ENTER" : "⚔ REGISTER"),
                        e("button", { style: { ...S.btnGold, background: "transparent", border: "1px solid rgba(255,215,0,0.2)", color: "#FFD700" }, onClick: () => { setMode(m => m === "login" ? "register" : "login"); setMsg(""); } }, mode === "login" ? "Create account" : "Back")
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(SoloLevelingTracker));
    </script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0a0a0f; }
        input:focus { border-color: rgba(255,215,0,0.5) !important; }
        input, button { font-family: 'Rajdhani', sans-serif; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.15); border-radius: 2px; }

        @media (max-width: 768px) {
            * { font-size: 14px; }
        }
    </style>
</body>
</html>
